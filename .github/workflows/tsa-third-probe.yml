# M1-MACRO-PIPELINE-V2 TSA third-candidate probe (C-CT, stage 1 only) — PROBE / NON-FORMAL / PRE-SELECTION.
# Implements M1-MACRO-PIPELINE-V2-TSA-THIRD-CANDIDATE-PROBE-SPEC-V0.1 (frozen in junsato1001-ops/-fx-forward-ledger,
# preregistration/, SHA-256 0658b04b...). Not Calibration, not Acceptance.
# Manual dispatch only (no schedule). Uses the audited probe/tsa_probe.py unchanged, with
# probe/tsa_third_config.json and out-root probe/tsa-third/. Writes only under probe/tsa-third/.
# Does not touch the running C-DC/C-GS P3 (probe/tsa_probe_config.json, tsa-probe.yml, probe/tsa/).
name: tsa-third-probe

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "p1 (once) | p4 (offline re-verify) | summary"
        required: true
        type: choice
        options: [p1, p4, summary]
      summary_date:
        description: "summary label YYYY-MM-DD (summary only)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: tsa-third-probe
  cancel-in-progress: false

env:
  TSA_PROBE_CONFIG: probe/tsa_third_config.json
  OUT_ROOT: probe/tsa-third

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout (git only, no third-party action)
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone --depth 50 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "tsa-probe-bot"
          git config user.email "tsa-probe-bot@users.noreply.github.com"
          git log -1 --format='checked out %H'

      - name: Select mode
        id: mode
        env:
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          case "$INPUT_MODE" in p1|p4|summary) ;; *) echo "invalid mode $INPUT_MODE"; exit 1;; esac
          echo "mode=$INPUT_MODE" >> "$GITHUB_OUTPUT"

      - name: Record tools
        run: |
          openssl version -a
          python3 --version
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          sha256sum repo/probe/tsa_probe.py repo/probe/tsa_third_config.json repo/probe/selftest.py

      - name: Self-test (local PKI on 127.0.0.1 only)
        if: steps.mode.outputs.mode == 'p1' || steps.mode.outputs.mode == 'p4'
        run: env -u TSA_PROBE_CONFIG python3 repo/probe/selftest.py

      - name: Run P1 (network)
        if: steps.mode.outputs.mode == 'p1'
        working-directory: repo
        run: python3 probe/tsa_probe.py p1 --out-root "$OUT_ROOT"

      - name: Run P4 (no network namespace)
        if: steps.mode.outputs.mode == 'p4'
        working-directory: repo
        run: |
          sudo unshare --net -- env TSA_PROBE_CONFIG="$TSA_PROBE_CONFIG" ImageOS="$ImageOS" ImageVersion="$ImageVersion" \
            RUNNER_OS="$RUNNER_OS" RUNNER_ARCH="$RUNNER_ARCH" GITHUB_RUN_ID="$GITHUB_RUN_ID" \
            GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" GITHUB_SHA="$GITHUB_SHA" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            python3 probe/tsa_probe.py p4 --out-root "$OUT_ROOT"
          sudo chown -R "$(id -u):$(id -g)" "$OUT_ROOT"

      - name: Run summary
        if: steps.mode.outputs.mode == 'summary'
        working-directory: repo
        env:
          SUMMARY_DATE: ${{ inputs.summary_date }}
        run: |
          echo "$SUMMARY_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "summary_date required"; exit 1; }
          python3 probe/tsa_probe.py summary --date "$SUMMARY_DATE" --out-root "$OUT_ROOT"

      - name: Commit results (probe/tsa-third only)
        working-directory: repo
        run: |
          if [ -z "$(git status --porcelain -- "$OUT_ROOT")" ]; then echo "nothing to commit"; exit 0; fi
          if [ -n "$(git status --porcelain | grep -v " $OUT_ROOT/" || true)" ]; then
            echo "unexpected changes outside $OUT_ROOT"; git status --porcelain; exit 1
          fi
          git add "$OUT_ROOT"
          git commit -q -m "probe(tsa-third): ${{ steps.mode.outputs.mode }} run ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} (NON-FORMAL, C-CT stage 1)"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "push failed"; exit 1

# M1-MACRO-PIPELINE-V2 TSA pre-selection probe — PROBE / NON-FORMAL / PRE-SELECTION.
# Implements M1-MACRO-PIPELINE-V2-TSA-PROBE-SPEC-V0.1 (frozen in junsato1001-ops/-fx-forward-ledger,
# preregistration/, SHA-256 a3e4e447...). Not Calibration, not Acceptance.
# Uses only this repository's GITHUB_TOKEN. No V1 credential, no other secret.
# Writes only under probe/tsa/.
name: tsa-probe

on:
  schedule:
    - cron: "41 * * * *"   # P3 slots (spec 5.4). No-op unless probe/tsa_probe_config.json sets p3_first_slot_utc.
  workflow_dispatch:
    inputs:
      mode:
        description: "p1 (once) | p4 (offline re-verify) | summary"
        required: true
        type: choice
        options: [p1, p4, summary]
      summary_date:
        description: "summary label YYYY-MM-DD (summary only)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: tsa-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout (git only, no third-party action)
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone --depth 50 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "tsa-probe-bot"
          git config user.email "tsa-probe-bot@users.noreply.github.com"
          git log -1 --format='checked out %H'

      - name: Select mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = "schedule" ]; then m=p3; else m="$INPUT_MODE"; fi
          case "$m" in p1|p3|p4|summary) ;; *) echo "invalid mode $m"; exit 1;; esac
          echo "mode=$m" >> "$GITHUB_OUTPUT"

      - name: Record tools
        run: |
          openssl version -a
          python3 --version
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
          sha256sum repo/probe/tsa_probe.py repo/probe/tsa_probe_config.json repo/probe/selftest.py

      - name: Self-test (local PKI on 127.0.0.1 only)
        if: steps.mode.outputs.mode == 'p1' || steps.mode.outputs.mode == 'p4'
        run: python3 repo/probe/selftest.py

      - name: Run probe (network)
        if: steps.mode.outputs.mode == 'p1' || steps.mode.outputs.mode == 'p3'
        working-directory: repo
        run: python3 probe/tsa_probe.py "${{ steps.mode.outputs.mode }}"

      - name: Run P4 (no network namespace)
        if: steps.mode.outputs.mode == 'p4'
        working-directory: repo
        run: |
          sudo unshare --net -- env ImageOS="$ImageOS" ImageVersion="$ImageVersion" RUNNER_OS="$RUNNER_OS" \
            RUNNER_ARCH="$RUNNER_ARCH" GITHUB_RUN_ID="$GITHUB_RUN_ID" GITHUB_RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" \
            GITHUB_SHA="$GITHUB_SHA" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            python3 probe/tsa_probe.py p4
          sudo chown -R "$(id -u):$(id -g)" probe/tsa

      - name: Run summary
        if: steps.mode.outputs.mode == 'summary'
        working-directory: repo
        env:
          SUMMARY_DATE: ${{ inputs.summary_date }}
        run: |
          echo "$SUMMARY_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' || { echo "summary_date required"; exit 1; }
          python3 probe/tsa_probe.py summary --date "$SUMMARY_DATE"

      - name: Commit results (probe/tsa only)
        working-directory: repo
        run: |
          if [ -z "$(git status --porcelain -- probe/tsa)" ]; then echo "nothing to commit"; exit 0; fi
          if [ -n "$(git status --porcelain | grep -v ' probe/tsa/' || true)" ]; then
            echo "unexpected changes outside probe/tsa"; git status --porcelain; exit 1
          fi
          git add probe/tsa
          git commit -q -m "probe(tsa): ${{ steps.mode.outputs.mode }} run ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} (NON-FORMAL)"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 5
          done
          echo "push failed"; exit 1
